name: Build Vitalk APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  NODE_VERSION: 24
  JDK_VERSION: 21

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JDK_VERSION }}
          distribution: 'temurin'

      - name: Install dependencies
        run: npm install

      - name: Install Capacitor CLI globally
        run: npm install -g @capacitor/cli@6

      - name: Build web assets
        run: npm run build

      - name: Add Android platform
        run: cap add android

      - name: Sync Capacitor
        run: cap sync android

      - name: Generate Keystore
        run: |
          keytool -genkey -v -keystore vitalk.keystore \
            -alias vitalk \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass vitalk123 -keypass vitalk123 \
            -dname "CN=Vitalk, OU=Dev, O=Unknown, L=Unknown, ST=Unknown, C=RU"

      - name: Patch build.gradle with signing config
        run: |
          cat << 'EOF' >> android/app/build.gradle
          android {
              signingConfigs {
                  release {
                      storeFile file('../../vitalk.keystore')
                      storePassword 'vitalk123'
                      keyAlias 'vitalk'
                      keyPassword 'vitalk123'
                      v1SigningEnabled true
                      v2SigningEnabled true
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF

      - name: Build and Sign APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Vitalk-Android-Signed
          path: android/app/build/outputs/apk/release/*.apk

